<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIA — Intro (No Particles)</title>
<style>
  :root{
    --bg-core:   #120a0d;
    --bg-mid:    #0a0808;
    --bg-outer:  #050405;
    --red:       #D31145;
    --red-deep:  #6e0d2c;
    --red-bright:#ff5c7c;
    --ink:       #F4EFE9;
    --ink-dim:   rgba(244,239,233,0.46);
    --wordmark-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--bg-outer);
    overflow:hidden;
  }

  #stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
      radial-gradient(ellipse 60% 50% at 50% 44%, var(--bg-core) 0%, var(--bg-mid) 55%, var(--bg-outer) 100%);
    will-change:opacity, transform;
  }

  .flash{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 50%,
      rgba(255, 255, 255, 1) 0%,
      rgba(255, 200, 210, 0.85) 6%,
      rgba(255, 92, 124, 0.4) 22%,
      rgba(211, 17, 69, 0.1) 45%,
      rgba(5, 4, 5, 0) 70%);
    opacity:0;
    mix-blend-mode:screen;
    pointer-events:none;
  }

  .ring{
    position:absolute;
    top:50%;
    left:50%;
    width:200px;
    height:200px;
    margin:-100px 0 0 -100px;
    border-radius:50%;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 0 20px 4px rgba(255, 92, 124, 0.5),
                inset 0 0 15px 4px rgba(255, 92, 124, 0.3);
    opacity:0;
    transform:scale(0.1);
    pointer-events:none;
  }

  .mark-wrap{
    position:relative;
    z-index:2;
    line-height:0;
  }

  #logo{
    width:clamp(92px, 13vw, 184px);
    height:auto;
    display:block;
    opacity:0;
    transform:scale(0.92);
    filter:drop-shadow(0 0 35px rgba(211,17,69,0.5));
  }

  #logo path{
    fill:var(--red);
  }

  .wordmark{
    position:relative;
    z-index:2;
    margin-top:clamp(16px, 2.6vw, 26px);
    font-family:var(--wordmark-font);
    font-weight:600;
    font-size:clamp(12px, 1.4vw, 16px);
    color:var(--ink);
    letter-spacing:0.6em;
    text-indent:0.14em;
  }

  .wordmark span{
    display:inline-block;
    opacity:0;
    transform:translateY(9px);
  }

  .tagline{
    position:relative;
    z-index:2;
    margin-top:clamp(8px, 1.2vw, 12px);
    font-family:var(--wordmark-font);
    font-weight:400;
    font-size:clamp(8px, 0.9vw, 11px);
    color:var(--ink);
    letter-spacing:0.36em;
    text-indent:0.22em;
    text-align:center;
    white-space:nowrap;
    opacity:0;
    transform:translateY(8px);
  }

  .skip-hint{
    position:absolute;
    left:0;
    right:0;
    bottom:clamp(20px, 5vh, 36px);
    text-align:center;
    font-family:var(--wordmark-font);
    font-size:11px;
    font-weight:400;
    letter-spacing:0.02em;
    color:var(--ink-dim);
    opacity:0;
    pointer-events:none;
  }

  html.fallback #logo{
    transition:opacity 0.7s ease, transform 0.7s ease;
  }
  html.fallback .wordmark{
    transition:letter-spacing 0.6s ease;
  }
  html.fallback .wordmark span{
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  html.fallback .tagline{
    transition:opacity 0.6s ease 0.15s, transform 0.6s ease 0.15s, letter-spacing 0.6s ease 0.15s;
  }
  html.fallback.reveal #logo{
    opacity:1;
    transform:scale(1);
  }
  html.fallback.reveal .wordmark{
    letter-spacing:0.14em;
  }
  html.fallback.reveal .wordmark span{
    opacity:1;
    transform:translateY(0);
  }
  html.fallback.reveal .tagline{
    opacity:0.75;
    transform:translateY(0);
    letter-spacing:0.22em;
  }

  @media (prefers-reduced-motion: reduce){
    .ring, .flash{ display:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="flash" aria-hidden="true"></div>
  <div class="ring" aria-hidden="true"></div>

  <div class="mark-wrap">

  </div>

  <div class="wordmark" aria-hidden="true"><span>A</span><span>I</span><span>A</span></div>
  <div class="tagline">HEALTHIER, LONGER, BETTER LIVES</div>

  <div class="skip-hint">Press any key to skip</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  var stage      = document.getElementById('stage');
  var logo       = document.getElementById('logo');
  var flash      = document.querySelector('.flash');
  var ring       = document.querySelector('.ring');
  var wordmark   = document.querySelector('.wordmark');
  var letters    = document.querySelectorAll('.wordmark span');
  var tagline    = document.querySelector('.tagline');
  var skipHint   = document.querySelector('.skip-hint');

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mainTl = null;

  function bindSkip(){
    var done = false;
    function skip(){
      if(done) return;
      done = true;
      if(mainTl) mainTl.progress(1);
    }
    window.addEventListener('keydown', skip);
    window.addEventListener('pointerdown', skip);
    return skip;
  }

  function onIntroComplete(){
    stage.style.pointerEvents = 'none';
    document.dispatchEvent(new CustomEvent('aia:intro-complete'));
  }

  function playFullIntro(){
    gsap.set(logo, { opacity: 0, scale: 0.92 });
    gsap.set(letters, { opacity: 0, y: 9 });
    gsap.set(wordmark, { letterSpacing: '0.6em' });
    gsap.set(tagline, { opacity: 0, y: 8, letterSpacing: '0.36em' });
    gsap.set(ring, { opacity: 0, scale: 0.1 });
    gsap.set(flash, { opacity: 0 });
    gsap.set(skipHint, { opacity: 0 });

    var tl = gsap.timeline({ onComplete: onIntroComplete });
    mainTl = tl;

    // 1 — Ignition: A highly realistic, natural flash and logo reveal
    tl.to(flash, { opacity: 1, duration: 0.15, ease: 'sine.inOut' }, 0.2) // Short delay before striking
      .to(flash, { opacity: 0, duration: 1.2, ease: 'power3.out' })
      .to(logo, { opacity: 1, scale: 1, duration: 1.0, ease: 'back.out(1.4)' }, '<') 
      .set(ring, { opacity: 0.8 }, '<')
      .to(ring, { scale: 3.8, opacity: 0, duration: 1.4, ease: 'expo.out' }, '<') 

      // 2 — The wordmark smoothly resolves
      .to(letters, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out', stagger: 0.09 }, '-=0.9')
      .to(wordmark, { letterSpacing: '0.14em', duration: 0.65, ease: 'power2.out' }, '<')
      .to(tagline, { opacity: 0.75, y: 0, letterSpacing: '0.22em', duration: 0.65, ease: 'power2.out' }, '-=0.35')
      .to(skipHint, { opacity: 0.4, duration: 0.6 }, '-=0.1')

      // 3 — One quiet breath while it holds (bounces front and back)
      .to(logo, { scale: 1.02, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: 1 }, '+=0.1')

      // 4 — Hand off to the app
      .to(skipHint, { opacity: 0, duration: 0.3 }, '+=0.15')
      .to(stage, { opacity: 0, scale: 1.04, duration: 0.75, ease: 'power1.inOut' }, '-=0.1');
  }

  function playReducedIntro(){
    gsap.set(logo, { opacity: 0, scale: 0.96 });
    gsap.set(letters, { opacity: 0, y: 6 });
    gsap.set(wordmark, { letterSpacing: '0.3em' });
    gsap.set(tagline, { opacity: 0, y: 6, letterSpacing: '0.28em' });

    var tl = gsap.timeline({ onComplete: onIntroComplete });
    mainTl = tl;
    tl.to(logo, { opacity: 1, scale: 1, duration: 0.6, ease: 'power2.out' })
      .to(letters, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out', stagger: 0.06 }, '-=0.15')
      .to(wordmark, { letterSpacing: '0.14em', duration: 0.5, ease: 'power2.out' }, '<')
      .to(tagline, { opacity: 0.75, y: 0, letterSpacing: '0.22em', duration: 0.5, ease: 'power2.out' }, '-=0.2')
      .to(stage, { opacity: 0, duration: 0.6, ease: 'power1.inOut' }, '+=0.9');
  }

  function playFallback(){
    document.documentElement.classList.add('fallback');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        document.documentElement.classList.add('reveal');
        setTimeout(function(){
          stage.style.transition = 'opacity 0.6s ease';
          stage.style.opacity = '0';
          setTimeout(onIntroComplete, 620);
        }, 1400);
      });
    });
  }

  bindSkip();

  if(typeof gsap === 'undefined'){
    playFallback();
    window.AIAIntro = { skip: onIntroComplete, replay: function(){ location.reload(); } };
    return;
  }

  window.AIAIntro = {
    skip: function(){ if(mainTl) mainTl.progress(1); },
    replay: function(){ location.reload(); }
  };

  if(reduceMotion){
    requestAnimationFrame(function(){ requestAnimationFrame(playReducedIntro); });
  } else {
    requestAnimationFrame(function(){ requestAnimationFrame(playFullIntro); });
  }
})();
</script>
</body>
</html>
